name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy (strict, src)
        run: mypy src

      - name: pytest
        run: pytest

  integration:
    # The core gate above deliberately never installs a backend, which keeps it
    # fast and dependency-free — and also means it cannot see the backend at all.
    # That blind spot is how a CLI default that silently discarded every table in
    # a document survived a fully green suite. This job is the counterweight: one
    # Python, real Unstructured, asserting tables actually survive the round trip.
    # The PDF extra is deliberately omitted — it pulls a multi-hundred-MB model
    # stack, and the HTML/PPTX paths exercise the same seam.
    name: Integration (real Unstructured backend)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package with the real backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,unstructured,unstructured-pptx]"

      - name: pytest (integration only)
        run: pytest -m integration
